<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>架构刷题</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --line:#e3e6eb; --text:#1f2328; --sub:#6b7280;
  --brand:#2f6fdb; --brand-soft:#eaf1fd;
  --ok:#1f9d63; --ok-soft:#e8f6ef; --no:#d9483f; --no-soft:#fdecea;
  --warn:#b4772a; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  overflow:hidden;user-select:none;
}
#app{display:grid;grid-template-columns:196px 1fr;height:100vh}

/* ---------- 侧栏 ---------- */
.side{background:#fbfbfc;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 16px}
.brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2f6fdb,#5b9bf5);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px}
.brand b{font-size:13.5px;letter-spacing:.3px}
.brand span{display:block;font-size:10.5px;color:var(--sub);font-weight:400;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:7px;
  background:transparent;color:#3d4450;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;
}
.nav button:hover{background:#f0f1f4}
.nav button.on{background:var(--brand-soft);color:#1f56b3;font-weight:600}
.nav .ico{width:15px;height:15px;opacity:.75}
.nav button.on .ico{opacity:1}
.badge{margin-left:auto;font-size:10.5px;background:#eceef2;color:#5b6472;padding:0 6px;border-radius:9px;min-width:18px;text-align:center}
.nav button.on .badge{background:#d6e4fb;color:#1f56b3}
.side .foot{margin-top:auto;padding:8px 6px;font-size:10px;color:#9aa4b2;line-height:1.75;display:block}
.side .foot span{white-space:nowrap;display:block}

/* ---------- 主区 ---------- */
.main{overflow-y:auto;padding:26px 30px 40px}
.wrap{max-width:780px;margin:0 auto}
h1{font-size:20px;font-weight:650;letter-spacing:.2px;margin-bottom:4px}
.lead{font-size:12.5px;color:var(--sub);margin-bottom:20px}

/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.sec-title{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.6px;margin:22px 0 10px}

/* 首页统计 */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:650;letter-spacing:.5px}
.stat b i{font-size:12px;font-weight:500;font-style:normal;color:var(--sub);margin-left:2px}
.stat span{font-size:11.5px;color:var(--sub)}

/* 分段控件 */
.seg{display:inline-flex;background:#eceef2;border-radius:9px;padding:3px;margin:2px 0 18px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:7px;font-size:12.5px;
  font-family:inherit;color:#4b5563;cursor:pointer;font-weight:500;transition:.15s}
.seg button.on{background:#fff;color:#1f56b3;font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.1)}
/* 考点卡 */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.chip{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff;cursor:pointer;transition:.15s}
.chip:hover{border-color:#b9cbf0;background:#fafbff}
.chip b{display:block;font-size:13px;margin-bottom:3px}
.chip span{font-size:11px;color:var(--sub)}
select.sel{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;font-family:inherit;background:#fff;color:#2b313a}
/* 考次格 */
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.paper{border:1px solid var(--line);border-radius:9px;padding:12px 13px;background:#fff;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.paper:hover{border-color:#b9cbf0;box-shadow:0 2px 8px rgba(47,111,219,.1)}
.paper b{font-size:13.5px;display:block;margin-bottom:6px}
.paper .bar{height:4px;border-radius:3px;background:#eceef2;overflow:hidden}
.paper .bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.paper .n{font-size:11px;color:var(--sub);margin-top:5px;display:flex;justify-content:space-between}
.paper .done{position:absolute;top:10px;right:11px;font-size:10px;color:var(--ok);font-weight:600}

/* 按钮 */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;font-size:12.5px;
  font-family:inherit;cursor:pointer;color:#2b313a;transition:.15s}
.btn:hover{background:#f7f8fa}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:hover{background:#2a63c6}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center}

/* ---------- 答题 ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.topbar .prog{flex:1;height:4px;background:#e7e9ee;border-radius:3px;overflow:hidden}
.topbar .prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
.topbar .idx{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.timer{font-size:12px;font-variant-numeric:tabular-nums;color:var(--warn);font-weight:600;display:none}

.qmeta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);margin-bottom:10px}
.tag{background:#f0f2f6;color:#4b5563;padding:1px 7px;border-radius:5px;font-size:10.5px}
.tag.multi{background:#fdf4e7;color:var(--warn)}
.star{margin-left:auto;background:none;border:0;cursor:pointer;font-size:15px;color:#c7ccd6;line-height:1;padding:2px}
.star.on{color:#f0a92b}
.stem{font-size:14.5px;line-height:1.78;white-space:pre-wrap;word-break:break-word;user-select:text}

.opts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid #e6e9ee;border-radius:9px;
  cursor:pointer;transition:.13s;background:#fff;line-height:1.65}
.opt:hover{border-color:#bdcff0;background:#fafbff}
.opt .k{flex:0 0 20px;height:20px;border-radius:50%;background:#f0f2f6;color:#5b6472;font-size:11.5px;
  display:grid;place-items:center;font-weight:600;margin-top:1px}
.opt .t{flex:1;user-select:text;word-break:break-word}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.ok{border-color:#8ed3b3;background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:#f0b4ae;background:var(--no-soft)}
.opt.no .k{background:var(--no);color:#fff}
.opt.lock{cursor:default}
.opt.lock:hover{background:inherit}

/* 解析 */
.exp{margin-top:16px;border-radius:9px;border:1px solid #e6e9ee;background:#fafbfc;padding:13px 15px;
  font-size:12.5px;line-height:1.8;user-select:text;word-break:break-word}
.exp .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600;font-size:12px}
.ansline{color:var(--ok);font-weight:700}
.ansline.bad{color:var(--no)}
.selfjudge{display:flex;gap:8px;margin-top:12px}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}

/* 打赏 */
.tiptext{font-size:12.5px;line-height:1.9;color:#3d4450;margin:0}
.tips{display:flex;gap:28px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.tip{text-align:center}
.tip img{width:156px;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px;box-shadow:var(--shadow)}
.tip span{display:block;font-size:11.5px;color:var(--sub);margin-top:7px}
.tipnote{font-size:11px;color:#9aa4b2;text-align:center;margin:10px 0 0}

/* 背诵卡 */
.qcard{margin-top:4px}
.cmode{font-size:11.5px;color:var(--sub);margin-left:auto}
.ctitle{font-size:15px;font-weight:650;line-height:1.6;margin:6px 0 12px;padding-bottom:10px;border-bottom:1px dashed #e3e6eb}
.cbody{font-size:13px;line-height:1.85;color:#2b313a;padding-right:4px;user-select:text}
.cbody.rev{color:#4b5563}
/* 卡片内容末尾留白，避免被吸底按钮遮住最后一行 */
.qcard .cbody:last-child{padding-bottom:58px}
.stickyfoot{position:sticky;bottom:-40px;background:#f4f5f7;border-top:1px solid #e6e9ee;
  padding:12px 2px 8px;margin:14px -2px 0;z-index:6}
.cbody p{margin:0 0 8px}
.cbody ul,.cbody ol{margin:4px 0 8px;padding-left:20px}
.cbody li{margin-bottom:3px}
.ch{font-weight:650;color:#4b5563;margin:10px 0 6px;font-size:12.5px}
.cdivider{font-size:11.5px;color:#9aa4b2;text-align:center;margin:14px 0 10px;letter-spacing:2px;
  border-top:1px dashed #e3e6eb;padding-top:10px}
.cback{background:#fafbfc;border-radius:8px;padding:12px 14px;border:1px solid #eceef2}
.tblwrap{overflow-x:auto;margin:8px 0}
table.ct{width:100%;border-collapse:collapse;font-size:11.5px}
table.ct th{background:#eef2f8;border:1px solid #d5dbe4;padding:4px 6px;text-align:left}
table.ct td{border:1px solid #e3e6eb;padding:4px 6px;vertical-align:top}
.btn.rate0{color:var(--no);border-color:#f0b4ae}
.btn.rate1{color:var(--warn);border-color:#e8cf9e}
.btn.rate2{background:var(--ok);border-color:var(--ok);color:#fff}

/* 视频 */
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#243044,#38496a);color:#fff;cursor:pointer;gap:8px}
.poster:hover .pbtn{transform:scale(1.06)}
.pbtn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;
  font-size:24px;padding-left:4px;transition:.18s;border:1px solid rgba(255,255,255,.3)}
.ptxt{font-size:13.5px;font-weight:600}
.psub{font-size:11.5px;color:rgba(255,255,255,.62)}
.player{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff;box-shadow:var(--shadow)}
.vh{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.vh b{font-size:13px;line-height:1.5;flex:1}
.tag2{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.tag2.pay{background:#fdf4e7;color:var(--warn)}
.vs{font-size:11.5px;color:var(--sub);margin-bottom:6px}
.vu{font-size:11.5px;color:#4b5563;margin-bottom:10px;line-height:1.6}
.btn.small{padding:5px 12px;font-size:11.5px}
.tag.topic{background:#eef4ff;color:#2f6fdb}

/* 结果 */
.score{font-size:44px;font-weight:700;letter-spacing:1px;line-height:1.1}
.score small{font-size:14px;color:var(--sub);font-weight:500;letter-spacing:0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #eceef2;font-size:12.5px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}

/* 列表 */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #f0f2f5;font-size:12.5px}
.item:last-child{border:0}
.item .q{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2b313a}
.item .m{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:#9aa4b2;font-size:12.5px;padding:46px 0}
.hide{display:none!important}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#f0f2f6;border:1px solid #e2e5ea;
  border-bottom-width:2px;border-radius:4px;padding:0 4px;color:#5b6472}
@media (max-width:720px){#app{grid-template-columns:1fr}.side{display:none}.main{padding:18px}}
/* 全真模考 */
.stagebar{display:flex;gap:8px;margin:14px 0 16px}
.stage{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:11.5px;color:var(--sub)}
.stage b{display:block;font-size:12.5px;color:var(--text);margin-bottom:2px}
.stage.on{border-color:#b9cbf0;background:#f5f9ff}
.stage.on b{color:#1f56b3}
.stage.ok{border-color:#bfe3ca;background:#f4fbf6}
.stage.ok b{color:#1a7d4f}
.ta{width:100%;min-height:110px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-family:inherit;font-size:13px;line-height:1.85;resize:vertical;background:#fff;color:var(--text);user-select:text}
.ta:focus{outline:none;border-color:#9db8f0;box-shadow:0 0 0 3px rgba(47,111,219,.10)}
.tameta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--sub);margin-top:7px}
.pickbox{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#3d4450;cursor:pointer;user-select:none}
.scorebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.scorebar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font:inherit;
  font-size:12px;cursor:pointer;color:#3d4450}
.scorebar button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eceef2;font-size:12.5px}
.mrow:last-child{border-bottom:0}
.mscore{font-size:26px;font-weight:650;letter-spacing:.5px}
.mscore small{font-size:12px;font-weight:500;color:var(--sub);margin-left:3px}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand"><div class="dot">架</div><div><b>架构刷题</b><span id="brandSub">系统架构设计师</span></div></div>
    <nav class="nav" id="nav">
      <button data-view="home" class="on">练习</button>
      <button data-view="mock">全真模考</button>
      <button data-view="cards">背诵卡<span class="badge" id="bgCard">0</span></button>
      <button data-view="video">视频课</button>
      <button data-view="wrong">错题本<span class="badge" id="bgWrong">0</span></button>
      <button data-view="fav">收藏<span class="badge" id="bgFav">0</span></button>
      <button data-view="stats">统计</button>
      <button data-view="about">关于</button>
    </nav>
    <div class="foot"><span id="ftCount"></span><span id="ftCount2"></span></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const BANK = __BANK__;
const SIM  = __SIM__;
const HIGH = __HIGH__;
const CARDS = __CARDS__;
const CARDS_OK = CARDS.filter(c=>c.back && c.back.length>=30);
const ALL  = BANK.concat(SIM).concat(HIGH);
const YEARS = [...new Set(BANK.map(q=>q.year))];
const SIMS  = [...new Set(SIM.map(q=>q.year))];
const byId = {}; ALL.forEach(q=>byId[q.year+'-'+q.no]=q);
const TOPIC = q => (q.topic||'').split('—')[0].trim() || '未分类';
const TOPICS = (()=>{ const m={}; SIM.forEach(q=>{ const t=TOPIC(q); m[t]=(m[t]||0)+1 });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]) })();
const HIGH_TOPICS = (()=>{ const m={}; HIGH.forEach(q=>{ const t=TOPIC(q); m[t]=(m[t]||0)+1 });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]) })();
const paperLabel = y => y.startsWith('模拟') ? y.replace('模拟','模拟卷 ')
  : y==='精选100' ? '精选 100 题'
  : /^\d{4}[上下]半$/.test(y) ? y.replace('上半',' 年上半年').replace('下半',' 年下半年')
  : y+'年';
/* 分组数 == 答案数 → 可自动判分（多空题按组对位比对） */
const AUTO = q => q.ans.length === q.groups.length;
const QID = q => q.year+'-'+q.no;

/* ---------------- 存储 ---------------- */
const Store = {
  key:'jgsj.v1',
  data:null,
  load(){
    let raw=null;
    if(window.__INIT__){ raw=window.__INIT__; }
    else { try{ raw=localStorage.getItem(this.key) }catch(e){} }
    let d={}; try{ d=JSON.parse(raw||'{}')||{} }catch(e){}
    this.data=Object.assign({rec:{},fav:{},wrong:{},pos:{},exam:[],cards:{},mock:null,mockHist:[]}, d);
    if(!this.data.cards) this.data.cards={};
    if(!this.data.mockHist) this.data.mockHist=[];
  },
  save(){
    const s=JSON.stringify(this.data);
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.store){
      window.webkit.messageHandlers.store.postMessage(s);
    } else { try{ localStorage.setItem(this.key,s) }catch(e){} }
  },
  rec(id){ return this.data.rec[id] || (this.data.rec[id]={r:0,w:0,last:0}) },
  mark(id,right){
    const r=this.rec(id); right?r.r++:r.w++; r.last=right?1:2;
    if(right){ if(this.data.wrong[id]) delete this.data.wrong[id] } else { this.data.wrong[id]=1 }
    this.save();
  },
  toggleFav(id){ if(this.data.fav[id]) delete this.data.fav[id]; else this.data.fav[id]=1; this.save() },
  wrongIds(){ return Object.keys(this.data.wrong) },
  favIds(){ return Object.keys(this.data.fav) },
  unseenCount(bank){ return (bank||ALL).filter(q=>!this.data.rec[QID(q)]).length },
  accuracy(){ let r=0,w=0; for(const k in this.data.rec){ r+=this.data.rec[k].r; w+=this.data.rec[k].w } return {r,w,t:r+w} }
};

/* ---------------- 工具 ---------------- */
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const $ = s => document.querySelector(s);
const main = $('#main');

/* ---------------- 会话 ---------------- */
let S = null;      // {pool, idx:[], mode, exam, deadline, picks:{}, done:{}}

function startSession(opts){
  S = Object.assign({pool:[], idx:0, mode:'order', exam:false, picks:{}, done:{}, startedAt:Date.now()}, opts);
  view='quiz'; clearInterval(timerH); render(); main.scrollTop=0;
}

/* ---------------- 视图 ---------------- */
let view='home';

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
  $('#bgWrong').textContent = Store.wrongIds().length;
  $('#bgFav').textContent = Store.favIds().length;
  const ft=$('#ftCount'); if(ft) ft.textContent = '真题 '+BANK.length+' · 模拟 '+SIM.length+' · 精选 '+HIGH.length;
  const ft2=$('#ftCount2'); if(ft2) ft2.textContent = '卡片 '+CARDS_OK.length+' · 数据存于本机';
  const bs=$('#brandSub'); if(bs) bs.textContent = '系统架构设计师 · '+ALL.length+' 题';
  const bc=$('#bgCard'); if(bc) bc.textContent = CARDS_OK.filter(c=>!(Store.data.cards[c.id]||{}).box).length;
  if(view==='quiz') return renderQuiz();
  if(view==='result') return renderResult();
  if(view==='home') return renderHome();
  if(view==='wrong') return renderList('wrong');
  if(view==='fav') return renderList('fav');
  if(view==='stats') return renderStats();
  if(view==='cards') return renderCards();
  if(view==='mock') return renderMock();
  if(view==='video') return renderVideo();
  if(view==='about') return renderAbout();
}

function go(v){ view=v; if(v!=='quiz') S=null; render(); main.scrollTop=0 }

/* ---- 首页 ---- */
let bankMode='real';
function setBank(m){ bankMode=m; render() }

function paperCard(y, list){
  const done=list.filter(q=>Store.data.rec[QID(q)]).length, p=Math.round(done/list.length*100);
  const lbl = paperLabel(y);
  return `<div class="paper" data-year="${y}">

let timerH=null;
function renderQuiz(){
  if(!S) { go('home'); return }

      else if(judged){

        else if(sel) cls+=' no';
      }
      return `<div class="${cls}" data-k="${o.k}" data-g="${gi}"><div class="k">${o.k}</div><div class="t">${esc(o.t)}</div></div>`;
    }).join('')}</div>`).join('');

  const showExp = !S.exam && judged;
  const ansText = ansLabel(q);
  const right = showExp && picked && q.ans.every((a,i)=>picked[i]===a);

  main.innerHTML=`<div class="wrap">
    <div class="topbar">
      <button class="btn" onclick="go('home')">← 退出</button>
      <div class="prog"><i style="width:${pct}%"></i></div>

    </div>
    <div class="card pad">

        <span class="tag">${paperLabel(q.year)}</span><span>第 ${q.no} 题</span>

        ${q.topic?`<span class="tag topic">${esc(TOPIC(q))}</span>`:''}
        <button class="star ${Store.data.fav[id]?'on':''}" id="star">★</button>
      </div>
      <div class="stem">${esc(q.stem)}</div>
      ${groups}
      ${!AUTO(q) && !S.exam && !judged ? `<div class="foot"><span style="font-size:11.5px;color:var(--sub)">该题选项与答案非一一对应，请自行对照评分</span><button class="btn primary" onclick="revealManual()">查看答案</button></div>`:''}
      ${showExp?`<div class="exp">
          <div class="hd">${AUTO(q)?(right?'回答正确':'回答错误'):'参考答案'}
            <span class="ansline ${right?'':'bad'}">${AUTO(q)?'正确答案 '+ansText:''}</span></div>
          ${AUTO(q)?'':`<div style="margin-bottom:8px"><b>答案：</b>${ansText}</div>`}
          <div style="white-space:pre-wrap">${esc(q.exp)}</div>
          ${AUTO(q)?'':`<div class="selfjudge">
            <button class="btn" onclick="manualJudge(1)">我答对了</button>
            <button class="btn" onclick="manualJudge(0)">我答错了</button></div>`}
        </div>`:''}
      <div class="foot">
        <button class="btn" onclick="prevQ()" ${S.idx===0?'disabled':''}>上一题</button>
        <div class="row">
          ${S.exam?`<span style="font-size:11.5px;color:var(--sub)">已答 ${Object.keys(S.done).length}</span>
                   <button class="btn primary" onclick="submitExam()">交卷</button>`
                 :`<button class="btn primary" onclick="nextQ()">下一题 →</button>`}
        </div>
      </div>
    </div>
  </div>`;

  main.querySelectorAll('.opt').forEach(el=>{
    if(!S.exam && judged) return;
    el.onclick=()=>pick(+el.dataset.g, el.dataset.k);
  });

  if(S.exam) startTimer();
}

function ansLabel(q){
  return q.groups.length>1 ? q.ans.map((a,i)=>`第${i+1}空 ${a}`).join('　') : q.ans.join('、');
}
function pick(gi, k){
  const q=S.pool[S.idx], id=QID(q);
  if(!AUTO(q) && !S.exam){ revealManual(); return }
  if(!S.exam && S.done[id]) return;
  const cur=(S.picks[id]||[]).slice(); cur[gi]=k; S.picks[id]=cur;
  const complete=q.groups.every((g,i)=>cur[i]);
  if(S.exam){
    if(complete) S.done[id]=1; else delete S.done[id];
    if(S.mock) saveMock();
    renderQuiz(); return;
  }
  if(!complete){ renderQuiz(); return }
  S.done[id]=1;
  Store.mark(id, q.ans.every((a,i)=>cur[i]===a));
  renderQuiz();
}
function revealManual(){ const q=S.pool[S.idx]; S.done[QID(q)]=1; renderQuiz() }
function manualJudge(ok){ const q=S.pool[S.idx]; Store.mark(QID(q), !!ok); nextQ() }
function nextQ(){ if(S.idx<S.pool.length-1){ S.idx++; renderQuiz(); main.scrollTop=0 } else finish() }
function prevQ(){ if(S.idx>0){ S.idx--; renderQuiz(); main.scrollTop=0 } }
function submitExam(){ if(confirm('确认交卷？')) finish() }

function startTimer(){
  clearInterval(timerH);
  const el=()=>$('#tm');
  const tick=()=>{
    const t=el(); if(!t) return clearInterval(timerH);
    let left=Math.max(0, S.deadline-Date.now());
    const m=String(Math.floor(left/60000)).padStart(2,'0'), s=String(Math.floor(left%60000/1000)).padStart(2,'0');
    t.style.display='inline-block'; t.textContent=`${m}:${s}`;
    if(left<=0){ clearInterval(timerH); finish() }
  };
  tick(); timerH=setInterval(tick,1000);
}

function finish(){
  clearInterval(timerH);
  if(S && S.mock) return mockSubmitS1();
  let right=0,wrong=0,blank=0,manual=0;
  S.pool.forEach(q=>{
    const id=QID(q), p=S.picks[id]||[];
    if(!p.filter(Boolean).length){ blank++; return }
    if(!AUTO(q)){ manual++; return }          // 选项与答案非一一对应，不计入自动判分
    q.ans.every((a,i)=>p[i]===a)?right++:wrong++;
    if(S.exam) Store.mark(id, q.ans.every((a,i)=>p[i]===a));
  });
  const total=S.pool.length;
  let score=null;
  if(S.exam){
    score=Math.round(right/total*75);
    Store.data.exam.unshift({ts:Date.now(),score,total,right,wrong,blank,
      dur:Math.round((Date.now()-S.startedAt)/60000)});
    Store.data.exam=Store.data.exam.slice(0,20); Store.save();
  }
  S.result={right,wrong,blank,manual,total,score};
  view='result'; render();
}

/* ---- 轻量 markdown 渲染（卡片与导出共用） ---- */
function mdHtml(t){
  const L=(t||'').replace(/\r/g,'').split('\n'), out=[]; let i=0;
  while(i<L.length){
    const l=L[i];
    if(/^\|/.test(l) && /^\|[\s:\-|]+\|?$/.test((L[i+1]||'').trim())){
      const rows=[]; while(i<L.length && /^\|/.test(L[i])){ rows.push(L[i]); i++ }
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      const h=cells(rows[0]), b=rows.slice(2).map(cells);
      out.push('<div class="tblwrap"><table class="ct"><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+
        '</tr></thead><tbody>'+b.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+
        '</tbody></table></div>'); continue;
    }
    if(/^#{2,4}\s/.test(l)){ out.push('<div class="ch">'+esc(l.replace(/^#+\s*/,''))+'</div>'); i++; continue }
    if(/^\s*[-*+]\s/.test(l)){ const it=[]; while(i<L.length && /^\s*[-*+]\s/.test(L[i])){ it.push(L[i].replace(/^\s*[-*+]\s+/,'')); i++ }
      out.push('<ul>'+it.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'); continue }
    if(/^\s*\d+[.、]\s/.test(l)){ const it=[]; while(i<L.length && /^\s*\d+[.、]\s/.test(L[i])){ it.push(L[i].replace(/^\s*\d+[.、]\s+/,'')); i++ }
      out.push('<ol>'+it.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'); continue }
    if(!l.trim()){ i++; continue }
    out.push('<p>'+esc(l)+'</p>'); i++;
  }
  return out.join('');
}

function switchDeck(k){ cKind=k; cIdx=0; cReveal=false; renderCards() }
function revealCard(){ cReveal=true; renderCards();
  const d=document.querySelector('.cdivider'); if(d) d.scrollIntoView({block:'start',behavior:'smooth'}) }
function skipCard(){ const d=cardDeck(); cIdx=nextCard(d,cIdx); cReveal=false; renderCards() }
function rateCard(n){
  const deck=cardDeck(), c=deck[cIdx];
  const st=Store.data.cards[c.id]||{box:0,seen:0};
  st.seen=(st.seen||0)+1;
  st.box = n===2 ? Math.min(3,(st.box||0)+1) : n===0 ? 0 : Math.max(1,st.box||0);
  st.ts=Date.now(); Store.data.cards[c.id]=st; Store.save();
  cIdx=nextCard(deck,cIdx); cReveal=false; renderCards();
}

/* ---- 导出 ---- */
function nativeSave(filename, content, fmt){
  if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.exportFile){
    window.webkit.messageHandlers.exportFile.postMessage({filename, content, fmt});
    return;
  }
  const blob=new Blob(['\ufeff'+content],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function qFrontHTML(q){
  const opts=q.groups.map(g=>g.items.map(o=>esc(o.k+'．'+o.t)).join('<br>')).join('<br>');
  return '<b>'+esc(paperLabel(q.year)+' 第'+q.no+'题')+'</b><br>'+
         esc(q.stem).replace(/\n/g,'<br>')+'<br><br>'+opts;
}
function qBackHTML(q){
  let a='<b>正确答案：'+q.ans.join('、')+'</b>';
  if(q.m) a+='　（多空题，请对照原卷）';
  a+='<br><br>'+esc(q.exp||'（源文件未提供解析）').replace(/\n/g,'<br>');
  return a;
}
function buildAnki(kind){
  const ids = kind==='wrong'? Store.wrongIds() : Store.favIds();
  if(!ids.length) return '';
  const rows=['#separator:tab','#html:true','#deck:软考架构师·'+(kind==='wrong'?'错题':'收藏')+'','#tags column:3'];
  ids.map(i=>byId[i]).filter(Boolean).forEach(q=>{
    const tags=[q.year, q.topic||'', kind==='wrong'?'错题':'收藏'].filter(Boolean).join(' ');
    rows.push(qFrontHTML(q).replace(/\t/g,' ')+'\t'+qBackHTML(q).replace(/\t/g,' ')+'\t'+tags);
  });
  return rows.join('\n');
}
function exportAnki(kind){
  const t=buildAnki(kind);
  if(!t) return alert('没有可导出的题目');
  nativeSave('架构'+(kind==='wrong'?'错题':'收藏')+'_Anki导入_'+Date.now()+'.txt', t, 'text');
}
function buildDoc(kind){
  const ids = kind==='wrong'? Store.wrongIds() : Store.favIds();
  if(!ids.length) return '';
  const qs=ids.map(i=>byId[i]).filter(Boolean);
  const L=['# 系统架构设计师 · '+(kind==='wrong'?'错题本':'收藏夹'),'# 导出时间 '+new Date().toLocaleString('zh-CN')+' ｜ 共 '+qs.length+' 题',''];
  qs.forEach((q,n)=>{
    L.push('## '+(n+1)+'. '+paperLabel(q.year)+' 第'+q.no+'题'+(q.topic?'　【'+q.topic+'】':''));
    L.push(q.stem);
    q.groups.forEach(g=>{ g.items.forEach(o=>L.push('- '+o.k+'．'+o.t)) });
    L.push('正确答案：'+q.ans.join('、'));
    L.push('解析：'+(q.exp||'（源文件未提供）'));
    const r=Store.data.rec[q.year+'-'+q.no]; if(r) L.push('作答记录：对 '+r.r+' 次 / 错 '+r.w+' 次');
    L.push('');
  });
  return L.join('\n');
}
function exportDoc(kind){
  const t=buildDoc(kind);
  if(!t) return alert('没有可导出的题目');
  nativeSave('架构'+(kind==='wrong'?'错题':'收藏')+'_'+Date.now()+'.docx', t, 'docx');
}

/* ================= 全真模考（三科连考） ================= */
const PASS=45;
const SUBJ=[
  {n:1,t:'综合知识',min:150,desc:'75 题单选'},
  {n:2,t:'案例分析',min:90, desc:'1 必答 + 2 选答'},
  {n:3,t:'论文',    min:120,desc:'4 选 1 · 2000 字以上'}
];
let M=null, mTimer=null;
let mockCfg={paper:null, caseYear:null, paperYear:null};
function saveMock(){ Store.data.mock=M; Store.save() }
function mockPapers(){ return [...YEARS,...SIMS].filter(y=>ALL.filter(q=>q.year===y).length>=60) }
function caseSets(){
  const m={}; CARDS_OK.forEach(c=>{ if(c.k==='case') (m[c.year]=m[c.year]||[]).push(c) });
  return Object.keys(m).filter(y=>m[y].length>=4).sort().reverse().map(y=>({y,arr:m[y].slice(0,5)}));
}
function paperSets(){
  const m={}; CARDS_OK.forEach(c=>{ if(c.k==='paper') (m[c.year]=m[c.year]||[]).push(c) });
  return Object.keys(m).filter(y=>m[y].length>=3).sort().reverse().map(y=>({y,arr:m[y]}));
}
function fmtLeft(ms){
  const l=Math.max(0,ms), m=Math.floor(l/60000), s=Math.floor(l%60000/1000);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function stopMockTimer(){ clearInterval(mTimer); mTimer=null }
function startMockTimer(sel, deadline, onEnd){
  stopMockTimer();
  const tick=()=>{
    const el=$(sel); if(!el){ stopMockTimer(); return }
    const left=Math.max(0,deadline-Date.now());
    el.textContent='剩 '+fmtLeft(left);
    if(left<=0){ stopMockTimer(); onEnd() }
  };
  tick(); mTimer=setInterval(tick,1000);
}
function stageBar(cur){
  return `<div class="stagebar">${SUBJ.map(s=>{
    const done=M&&M.doneStages&&M.doneStages[s.n];
    const on=M&&M.stage===s.n;
    return `<div class="stage ${done?'ok':''} ${on?'on':''}"><b>${s.t}</b>${done?'已完成':(on?'进行中':s.min+' 分钟')}</div>`;
  }).join('')}</div>`;
}

function renderMock(){
  stopMockTimer();
  if(!M) return renderMockSetup();
  if(M.stage===1) return renderMockPending();
  if(M.stage===2) return renderMockCase();
  if(M.stage===3) return renderMockPaper();
  return renderMockResult();
}

function renderMockSetup(){
  const ps=mockPapers(), cs=caseSets(), pp=paperSets();
  if(!mockCfg.paper) mockCfg.paper = YEARS[YEARS.length-1]||ps[0];
  if(!mockCfg.caseYear) mockCfg.caseYear = cs.length?cs[0].y:'';
  if(!mockCfg.paperYear) mockCfg.paperYear = pp.length?pp[0].y:'';
  const opt=(arr,cur,fn)=>arr.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(fn?fn(v):v)}</option>`).join('');
  const hist=Store.data.mockHist||[];
  main.innerHTML=`<div class="wrap">
    <h1>全真模考</h1>
    <p class="lead">按真实考试节奏三科连考：综合知识 150 分钟 → 案例分析 90 分钟 → 论文 120 分钟。每科满分 75 分、45 分及格，三科同时达标才算通过。</p>
    ${stageBar(0)}
    <div class="card pad">
      <div class="row" style="flex-wrap:wrap;gap:16px">
        <label style="font-size:12.5px;color:var(--sub)">综合知识卷
          <select class="sel" onchange="mockCfg.paper=this.value">${opt(ps,mockCfg.paper,paperLabel)}</select></label>
        <label style="font-size:12.5px;color:var(--sub)">案例套次
          <select class="sel" onchange="mockCfg.caseYear=this.value">${opt(cs.map(x=>x.y),mockCfg.caseYear,v=>v+'（'+((cs.find(z=>z.y===v)||{}).arr||[]).length+' 题）')}</select></label>
        <label style="font-size:12.5px;color:var(--sub)">论文题组
          <select class="sel" onchange="mockCfg.paperYear=this.value">${opt(pp.map(x=>x.y),mockCfg.paperYear,v=>v+'（'+((pp.find(z=>z.y===v)||{}).arr||[]).length+' 题）')}</select></label>
      </div>
      <div class="foot" style="margin-top:18px">
        <span style="font-size:11.5px;color:var(--sub)">中途退出不暂停计时，回来可继续</span>
        <button class="btn primary" onclick="startMock()">开始考试</button>
      </div>
    </div>
    <div class="sec-title">考试规则</div>
    <div class="card pad" style="font-size:12.5px;line-height:1.95;color:#3d4450">
      <b>1. 综合知识</b>　75 道单选，150 分钟，满分 75 分，答完自动判分。<br>
      <b>2. 案例分析</b>　试题一必答 + 试题二～五选答 2 道（每题 25 分），90 分钟。交卷后逐题对照参考答案给自己打分。<br>
      <b>3. 论文</b>　4 道题选 1 道，120 分钟，正文 2000 字以上。交卷后对照写作要点自评。<br>
      <b>4. 通过标准</b>　三科均 ≥ ${PASS} 分（单科不过即整体不过，与真实考试一致）。
    </div>
    ${hist.length?`<div class="sec-title">历史成绩</div>
      <div class="card pad">${hist.slice(0,8).map(h=>`<div class="mrow">
        <span style="width:120px;color:var(--sub)">${new Date(h.ts).toLocaleDateString('zh-CN')}</span>
        <span style="flex:1">综合 ${h.s1} · 案例 ${h.s2} · 论文 ${h.s3}</span>
        <b style="color:${h.pass?'var(--ok)':'var(--no)'}">${h.pass?'通过':'未通过'}</b>
      </div>`).join('')}</div>`:''}
  </div>`;
}

function startMock(){
  M={id:'m'+Date.now(), ts:Date.now(), stage:1,
     paper:mockCfg.paper, caseYear:mockCfg.caseYear, paperYear:mockCfg.paperYear,
     d1:Date.now()+150*60000, d2:0, d3:0,
     picks:{}, done:{}, caseAns:{}, caseSel:[], caseScore:{},
     paperPick:null, paperText:'', s1:null, s2:null, s3:null, doneStages:{}};
  saveMock(); startMockS1();
}
function startMockS1(){
  M.stage=1; saveMock();
  startSession({pool:ALL.filter(q=>q.year===M.paper), mode:'exam', exam:true, mock:1,
                deadline:M.d1, picks:M.picks, done:M.done});
}
function mockAbort(){
  if(!confirm('放弃本次模考？已作答内容会清空。')) return;
  stopMockTimer(); M=null; Store.data.mock=null; Store.save(); renderMock();
}
function renderMockPending(){
  const total=ALL.filter(q=>q.year===M.paper).length;
  main.innerHTML=`<div class="wrap">
    <h1>综合知识 · 进行中</h1>
    <p class="lead">${paperLabel(M.paper)} · 已答 ${Object.keys(M.done).length} / ${total}</p>
    ${stageBar(1)}
    <div class="card pad">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div><div class="mscore" id="mleft">剩 --:--</div>
          <div style="font-size:12px;color:var(--sub);margin-top:4px">时间到自动交卷并进入案例</div></div>
        <div class="row" style="gap:8px">
          <button class="btn" onclick="mockAbort()">放弃本次</button>
          <button class="btn primary" onclick="startMockS1()">继续作答</button>
        </div>
      </div>
    </div>
  </div>`;
  startMockTimer('#mleft', M.d1, ()=>{ if(M&&M.stage===1) mockSubmitS1() });
}
function mockSubmitS1(){
  stopMockTimer();
  const qs=ALL.filter(q=>q.year===M.paper);
  let right=0, blank=0, manual=0;
  qs.forEach(q=>{
    const p=M.picks[QID(q)]||[];
    if(!p.filter(Boolean).length){ blank++; return }
    if(!AUTO(q)){ manual++; return }
    if(q.ans.every((a,i)=>p[i]===a)) right++;
  });
  M.s1=Math.round(right/qs.length*75);
  M.s1d={right,blank,manual,total:qs.length};
  M.doneStages[1]=1; M.stage=2;
  if(!M.d2) M.d2=Date.now()+90*60000;
  saveMock(); view='mock'; S=null; clearInterval(timerH); render(); main.scrollTop=0;
}

/* ---- 案例 ---- */
function mockCaseSet(){ return (caseSets().find(s=>s.y===M.caseYear)||caseSets()[0]||{arr:[]}).arr }
function mockCaseInput(id, v){ M.caseAns[id]=v; saveMock() }
function mockCaseSel(id, on){
  const i=M.caseSel.indexOf(id);
  if(on && i<0){ if(M.caseSel.length>=2) return false; M.caseSel.push(id) }
  else if(!on && i>=0) M.caseSel.splice(i,1);
  saveMock(); renderMockCase(); return true;
}
function renderMockCase(){
  const arr=mockCaseSet(), req=arr[0], opt=arr.slice(1);
  const grade=!!M.caseGrade;
  const card=(c,isReq)=>{
    const sel=M.caseSel.indexOf(c.id)>=0;
    const sc=M.caseScore[c.id];
    return `<div class="card pad" style="margin-bottom:14px">
      <div class="qmeta">
        <span class="tag">${isReq?'必答':'选答'}</span>
        <span style="font-size:12px;color:var(--sub)">${esc(c.title)}</span>
        ${grade?'':(isReq?'':`<label class="pickbox" style="margin-left:auto"><input type="checkbox" ${sel?'checked':''}
           onchange="if(!mockCaseSel('${c.id}',this.checked)){this.checked=false;alert('最多选 2 道选答题')}"> 选这题</label>`)}
      </div>
      <div class="cbody" style="max-height:none">${mdHtml(c.front)}</div>
      ${grade?`
        <div class="cdivider">参考答案</div>
        <div class="cbody cback">${mdHtml(c.back)}</div>
        <div class="scorebar"><span style="font-size:12px;color:var(--sub)">自评得分</span>
          ${[0,5,10,15,20,25].map(v=>`<button class="${sc===v?'on':''}" onclick="mockCaseScore('${c.id}',${v})">${v}</button>`).join('')}
          <span style="font-size:11.5px;color:var(--sub);margin-left:4px">满分 25</span></div>`
      :`<div class="tawrap"><textarea class="ta" placeholder="在这里写答题要点（考试时可以只写关键词，自评时对照踩分点）"
          oninput="mockCaseInput('${c.id}',this.value)">${esc(M.caseAns[c.id]||'')}</textarea></div>`}
    </div>`;
  };
  const need=[req?req.id:null,...M.caseSel].filter(Boolean);
  const allScored=need.length && need.every(x=>M.caseScore[x]!=null);
  main.innerHTML=`<div class="wrap">
    <div class="topbar">
      <span style="font-size:12.5px;color:var(--sub)">案例分析 · ${esc(M.caseYear)}</span>
      <div style="flex:1"></div>
      <span class="timer" id="mleft" style="display:inline-block">--:--</span>
    </div>
    ${stageBar(2)}
    <p class="lead" style="margin-bottom:12px">试题一必答，再从试题二～五中选 2 道，共 3 题 × 25 分 = 75 分。
      ${grade?'逐题对照参考答案给自己打分，打完自动进入论文。':'交卷后展开参考答案自评。'}</p>
    ${arr.length?card(req,true)+opt.map(c=>card(c,false)).join(''):'<div class="empty">没有可用的案例套次</div>'}
    <div class="foot stickyfoot">
      <span style="font-size:11.5px;color:var(--sub)">${grade?`已评 ${need.filter(x=>M.caseScore[x]!=null).length}/${need.length} 题 · 合计 ${need.reduce((s,x)=>s+(M.caseScore[x]||0),0)} 分`
        :`已选选答题 ${M.caseSel.length}/2`}</span>
      ${grade?`<button class="btn primary" ${allScored?'':'disabled'} onclick="mockToPaper()">进入论文 →</button>`
             :`<button class="btn primary" onclick="mockSubmitCase()">交卷</button>`}
    </div>
  </div>`;
  if(!grade) startMockTimer('#mleft', M.d2, ()=>{ if(M&&M.stage===2) mockSubmitCase(true) });
}
function mockSubmitCase(auto){
  if(!auto && M.caseSel.length!==2 && !confirm('还没选满 2 道选答题，确认交卷？')) return;
  stopMockTimer(); M.caseGrade=true; saveMock(); renderMockCase(); main.scrollTop=0;
}
function mockCaseScore(id, v){
  M.caseScore[id]=v;
  const arr=mockCaseSet(), need=[arr[0]&&arr[0].id,...M.caseSel].filter(Boolean);
  if(need.length && need.every(x=>M.caseScore[x]!=null)) M.s2=need.reduce((s,x)=>s+M.caseScore[x],0);
  saveMock(); renderMockCase();
}
function mockToPaper(){
  M.doneStages[2]=1; M.stage=3; if(!M.d3) M.d3=Date.now()+120*60000;
  saveMock(); render(); main.scrollTop=0;
}

/* ---- 论文 ---- */
function mockPaperList(){ return (paperSets().find(s=>s.y===M.paperYear)||paperSets()[0]||{arr:[]}).arr }
function mockPaperText(v){ M.paperText=v; saveMock(); const el=$('#wc'); if(el) el.textContent='字数 '+cnCount(v) }
function cnCount(s){ return (String(s||'').match(/[\u4e00-\u9fa5]/g)||[]).length }
function renderMockPaper(){
  const arr=mockPaperList(), grade=!!M.paperGrade;
  const cur=arr.find(c=>c.id===M.paperPick);
  main.innerHTML=`<div class="wrap">
    <div class="topbar">
      <span style="font-size:12.5px;color:var(--sub)">论文 · ${esc(M.paperYear)}</span>
      <div style="flex:1"></div>
      <span class="timer" id="mleft" style="display:inline-block">--:--</span>
    </div>
    ${stageBar(3)}
    ${!grade?`
      <p class="lead" style="margin-bottom:12px">4 道题选 1 道，120 分钟，正文不少于 2000 字（摘要 280–300 字）。先选题再动笔。</p>
      ${arr.map(c=>`<div class="card pad" style="margin-bottom:12px;cursor:pointer;${M.paperPick===c.id?'border-color:#9db8f0;background:#f7faff':''}"
          onclick="M.paperPick='${c.id}';saveMock();renderMockPaper()">
          <div class="qmeta"><span class="tag">${M.paperPick===c.id?'已选':'题目'}</span>
            <b style="font-size:13.5px">${esc(c.title)}</b></div>
          <div class="cbody" style="max-height:180px;overflow:hidden;margin-top:8px">${mdHtml(c.front)}</div>
        </div>`).join('')}
      ${cur?`<div class="card pad" style="margin-top:6px">
        <div class="qmeta"><span class="tag topic">作答区</span><b>${esc(cur.title)}</b></div>
        <div class="tawrap"><textarea class="ta" style="min-height:300px"
          placeholder="【摘要】…&#10;&#10;【正文】…"
          oninput="mockPaperText(this.value)">${esc(M.paperText||'')}</textarea>
          <div class="tameta"><span>摘要 + 正文都写在这里</span><span id="wc">字数 ${cnCount(M.paperText)}</span></div>
        </div>
      </div>`:'<div class="empty">先在上面选一道题</div>'}
    `:`
      <p class="lead" style="margin-bottom:12px">参考答案与写作要点，对照给自己打分（满分 75，及格 45）。</p>
      <div class="card pad" style="margin-bottom:14px">
        <div class="qmeta"><span class="tag topic">我的作答</span><b>${esc(cur?cur.title:'')}</b>
          <span class="cmode">${cnCount(M.paperText)} 字</span></div>
        <div class="cbody" style="max-height:220px;overflow:auto;white-space:pre-wrap">${esc(M.paperText||'（未作答）')}</div>
      </div>
      <div class="card pad">
        <div class="qmeta"><span class="tag">写作要点</span><b>${esc(cur?cur.title:'')}</b></div>
        <div class="cbody cback">${mdHtml(cur?cur.back:'')}</div>
        <div class="scorebar"><span style="font-size:12px;color:var(--sub)">自评得分</span>
          ${[0,30,45,55,60,65,70,75].map(v=>`<button class="${M.s3===v?'on':''}" onclick="mockPaperScore(${v})">${v}</button>`).join('')}</div>
      </div>
    `}
    <div class="foot stickyfoot">
      <span style="font-size:11.5px;color:var(--sub)">${grade?'评完分生成成绩单':(cur?'已选：'+esc(cur.title):'还没选题')}</span>
      ${grade?`<button class="btn primary" ${M.s3!=null?'':'disabled'} onclick="mockFinish()">生成成绩单</button>`
             :`<button class="btn primary" onclick="mockSubmitPaper()">交卷</button>`}
    </div>
  </div>`;
  if(!grade) startMockTimer('#mleft', M.d3, ()=>{ if(M&&M.stage===3) mockSubmitPaper(true) });
}
function mockSubmitPaper(auto){
  if(!M.paperPick){ if(!auto) alert('请先选择一道论文题'); return }
  stopMockTimer(); M.paperGrade=true; saveMock(); renderMockPaper(); main.scrollTop=0;
}
function mockPaperScore(v){ M.s3=v; M.doneStages[3]=1; saveMock(); renderMockPaper() }
function mockFinish(){
  const h={ts:M.ts, paper:M.paper, caseYear:M.caseYear, paperYear:M.paperYear,
           s1:M.s1, s2:M.s2, s3:M.s3, s1d:M.s1d,
           pass:[M.s1,M.s2,M.s3].every(x=>x>=PASS)};
  Store.data.mockHist=(Store.data.mockHist||[]).concat([h]).slice(-20);
  M.stage=4; saveMock(); render(); main.scrollTop=0;
}
function renderMockResult(){
  const s=[M.s1,M.s2,M.s3], pass=s.every(x=>x>=PASS);
  main.innerHTML=`<div class="wrap">
    <h1>模考成绩单</h1>
    <p class="lead">${paperLabel(M.paper)} · 案例 ${esc(M.caseYear)} · 论文 ${esc(M.paperYear)} · ${new Date(M.ts).toLocaleString('zh-CN')}</p>
    <div class="card pad" style="text-align:center;padding:26px 20px">
      <div class="mscore" style="color:${pass?'var(--ok)':'var(--no)'};font-size:34px">${pass?'通过':'未通过'}</div>
      <div style="font-size:12.5px;color:var(--sub);margin-top:6px">三科均需 ≥ ${PASS} 分</div>
      <div class="stat3" style="margin-top:20px;text-align:left">
        ${SUBJ.map((x,i)=>`<div class="stat"><b>${s[i]}<i>/75</i></b><span>${x.t}${s[i]>=PASS?'':' · 未及格'}</span></div>`).join('')}
      </div>
    </div>
    <div class="sec-title">综合知识明细</div>
    <div class="card pad" style="font-size:12.5px;line-height:2;color:#3d4450">
      共 ${M.s1d?M.s1d.total:0} 题 · 答对 ${M.s1d?M.s1d.right:0} · 未答 ${M.s1d?M.s1d.blank:0} · 需人工复核 ${M.s1d?M.s1d.manual:0}<br>
      案例与论文为自评分，仅供定位差距，不代表阅卷结果。
    </div>
    <div class="foot">
      <button class="btn" onclick="M=null;Store.data.mock=null;Store.save();renderMock()">重新模考</button>
      <button class="btn primary" onclick="go('stats')">看统计</button>
    </div>
  </div>`;
}

/* ---------------- 键盘 ---------------- */
document.addEventListener('keydown', e=>{
  if(view!=='quiz'||!S) return;
  const k=e.key.toUpperCase();
  const q=S.pool[S.idx]; if(!q) return;
  const map={'1':'A','2':'B','3':'C','4':'D','A':'A','B':'B','C':'C','D':'D'};
  if(map[k] && !(S.done[QID(q)]&&!S.exam)){
    e.preventDefault();
    const cur=S.picks[QID(q)]||[];
    const gi=Math.max(0, q.groups.findIndex((g,i)=>!cur[i]));
    pick(gi, map[k]);
  }
  else if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); if(S.exam){ nextQ() } else nextQ() }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prevQ() }
  else if(k==='F'){ Store.toggleFav(QID(q)); renderQuiz() }
});

/* ---------------- 启动 ---------------- */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));
Store.load(); M=Store.data.mock||null; render();
if(location.hash==='#demo'){ startSession({pool:BANK.slice(0,5),mode:'order',paper:'2024下'}) }
</script>
</body>
</html>
