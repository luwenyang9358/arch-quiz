<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;background:transparent;overflow:hidden}
.tile{width:512px;height:512px;border-radius:115px;
  background:linear-gradient(145deg,#3b7de8 0%,#2f6fdb 45%,#2757ad 100%);
  display:grid;place-items:center;position:relative;overflow:hidden;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28), inset 0 -6px 18px rgba(0,0,0,.16)}
.tile::after{content:"";position:absolute;top:-140px;left:-120px;width:420px;height:420px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.g{font:700 268px/1 "PingFang SC","Hiragino Sans GB",sans-serif;color:#fff;letter-spacing:-6px;
  text-shadow:0 4px 10px rgba(0,0,0,.18);transform:translateY(-6px)}
</style></head><body><div class="tile"><div class="g">架</div></div></body></html>
